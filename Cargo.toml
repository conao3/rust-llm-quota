[package]
name = "llm-quota"
version = "0.1.0"
edition = "2024"
description = "CLI tool to inspect and report LLM usage quota information"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "tls-webpki-roots", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
